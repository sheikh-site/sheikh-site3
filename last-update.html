<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آخر الإضافات - الشيخ محمد زين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap');

        :root {
            --bg-body: #f4f7f6;
            --bg-surface: #ffffff;
            --primary: #27ae60; /* لون أخضر لتمييز التحديثات الجديدة */
            --header-blue: #1a3a5f;
            --text-main: #1a1a1a;
            --border: #e6e9f1;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* --- شاشة الترحيب (مطابقة للتفسير) --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--header-blue);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .loading-logo h2 { font-family: 'Amiri', serif; color: #fff; font-size: 2.2rem; text-align: center; margin-bottom: 10px;}
        .loading-logo p { color: #b3e5fc; text-align: center; margin-bottom: 20px; }
        .progress-outline { width: 85%; max-width: 500px; height: 45px; border: 2px solid #ffffff; border-radius: 12px; padding: 4px; display: flex; align-items: center; }
        .progress-inner { height: 100%; width: 0%; background: #3498db; border-radius: 8px; transition: width 0.1s linear; }
        .progress-label { color: white; margin-top: 10px; font-weight: bold; }

        /* --- التنسيقات العامة --- */
        body { font-family: 'Noto Kufi Arabic', sans-serif; background: var(--bg-body); margin: 0; }
        header { background: #fff; padding: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav-inner { width: 92%; max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
        
        .lang-btns button { padding: 6px 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; border-radius: 8px; font-weight: bold; margin-left: 5px; }
        .lang-btns button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .container { width: 92%; max-width: 1000px; margin: auto; padding-bottom: 50px; }
        .section-title { text-align: center; font-family: 'Amiri', serif; padding: 35px 0; color: var(--primary); font-size: 2.5rem; }

        /* بطاقة الكتاب المضاف حديثاً */
        .book-card { background: #fff; border-radius: 18px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; position: relative; }
        .new-badge { position: absolute; top: 15px; left: 15px; background: #e67e22; color: white; padding: 4px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; }
        
        .book-top { padding: 25px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .book-info h3 { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--primary); margin: 0 0 5px 0; }
        
        .pdf-btn { display: inline-flex; align-items: center; gap: 8px; background: #e74c3c; color: #fff; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; margin: 0 22px 20px; font-weight: bold; }

        .lessons-list { display: none; padding: 15px; background: #fcfcfc; border-top: 1px solid var(--border); max-height: 450px; overflow-y: auto; }
        .book-card.active .lessons-list { display: block; }
        
        .audio-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; gap: 10px; }
        audio { height: 35px; flex-grow: 1; }

        footer { text-align: center; padding: 30px; opacity: 0.7; font-size: 0.85rem; }
        footer { text-align: center; padding: 50px 0; border-top: 1px solid var(--border); margin-top: 80px; color: var(--text-dim); font-size: 0.85rem; }
        .footer-social { margin-bottom: 15px; }
        .footer-social a { color: #0088cc; text-decoration: none; font-size: 1.2rem; transition: 0.3s; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-logo">
            <h2>الشيخ محمد زين بن آدم</h2>
            <p id="splash-text">آخر الكتب والشروح المضافة</p>
        </div>
        <div class="progress-outline"><div class="progress-inner" id="p-bar"></div></div>
        <div class="progress-label" id="p-text">0%</div>
    </div>

    <header>
        <div class="nav-inner">
            <a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: bold;"><i class="fa-solid fa-house"></i> <span data-key="back">الرئيسية</span></a>
            <div class="lang-btns">
                <button id="btn-ar" class="active" onclick="changeLang('ar')">AR</button>
                <button id="btn-en" onclick="changeLang('en')">EN</button>
                <button id="btn-am" onclick="changeLang('am')">AM</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="section-title" data-key="title">آخر التحديثات</h1>
        <div id="updates-list"></div>
    </div>
 <footer>
        <div class="footer-social">
            <a href="https://t.me/SheikhMohammadZayn" target="_blank"><i class="fa-brands fa-telegram"></i> <span data-key="telegram">قناة الدروس الرسمية</span></a>
        </div>
        <p><span data-key="rights">جميع الحقوق محفوظة &copy; 2026 | المنصة العلمية لفضيلة الشيخ محمد زين بن آدم</span></p>
    </footer>

    <script>
        const translations = {
            ar: {
                back: "الرئيسية", title: "الإضافات الجديدة", lesson: "الدرس", pdf: "تحميل الكتاب PDF", new: "جديد",
                books: [
                    { title: "تفسير السعدي", author: "الشيخ عبد الرحمن السعدي", total: 420, slug: "saadi" },
                    { title: "رياض الصالحين", author: "الإمام النووي", total: 150, slug: "riyadh" },
                    { title: "سنن ابن ماجة", author: "الإمام ابن ماجة", total: 180, slug: "ibnmajah" },
                    { title: "سنن النسائي", author: "الإمام النسائي", total: 210, slug: "nasai" },
                    { title: "القول المفيد على كتاب التوحيد", author: "الشيخ ابن عثيمين", total: 110, slug: "qawl" }
                ]
            },
            en: {
                back: "Home", title: "Latest Updates", lesson: "Lesson", pdf: "Download PDF", new: "NEW",
                books: [
                    { title: "Tafsir al-Saadi", author: "Sheikh Abdul Rahman al-Saadi", total: 420, slug: "saadi" },
                    { title: "Riyad as-Salihin", author: "Imam al-Nawawi", total: 150, slug: "riyadh" },
                    { title: "Sunan Ibn Majah", author: "Imam Ibn Majah", total: 180, slug: "ibnmajah" },
                    { title: "Sunan al-Nasai", author: "Imam al-Nasai", total: 210, slug: "nasai" },
                    { title: "Al-Qawl al-Mufid", author: "Sheikh Ibn Uthaymeen", total: 110, slug: "qawl" }
                ]
            },
            am: {
                back: "ዋና ገጽ", title: "አዳዲስ ትምህርቶች", lesson: "ክፍል", pdf: "መጽሐፉን አውርድ", new: "አዲስ",
                books: [
                    { title: "ተፍሲር አስ-ሰዕዲ", author: "ሸይኽ አብዱራህማን አስ-ሰዕዲ", total: 420, slug: "saadi" },
                    { title: "ሪያዱ አስ-ሷሊሂን", author: "ኢማም አል-ነወዊ", total: 150, slug: "riyadh" },
                    { title: "ሱነን ኢብኑ ማጃህ", author: "ኢማም ኢብኑ ማጃህ", total: 180, slug: "ibnmajah" },
                    { title: "ሱነን አን-ነሳኢ", author: "ኢማም አን-ነሳኢ", total: 210, slug: "nasai" },
                    { title: "አል-ቀውሉል ሙፊድ", author: "ሸይኽ ኢብኑ ኡሰይሚን", total: 110, slug: "qawl" }
                ]
            }
        };

        function changeLang(lang) {
            document.querySelectorAll('.lang-btns button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.querySelectorAll('[data-key]').forEach(el => {
                el.innerText = translations[lang][el.getAttribute('data-key')];
            });
            renderUpdates(lang);
        }

        function renderUpdates(lang) {
            const list = document.getElementById('updates-list');
            list.innerHTML = '';
            translations[lang].books.forEach(book => {
                let audioRows = '';
                for(let i=1; i<=book.total; i++) {
                    const url = `https://archive.org/download/osoul-5/${book.slug}%20(${i}).mp3`;
                    audioRows += `<div class="audio-row"><span>${translations[lang].lesson} ${i}</span><audio controls preload="none"><source src="${url}"></audio></div>`;
                }
                list.innerHTML += `
                    <div class="book-card">
                        <span class="new-badge">${translations[lang].new}</span>
                        <div class="book-top" onclick="this.parentElement.classList.toggle('active')">
                            <div class="book-info"><h3>${book.title}</h3><small>${book.author}</small></div>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <a href="#" class="pdf-btn"><i class="fa-solid fa-file-pdf"></i> ${translations[lang].pdf}</a>
                        <div class="lessons-list">${audioRows}</div>
                    </div>`;
            });
        }

        // Loader Logic
        let p = 0;
        const interval = setInterval(() => {
            p += Math.floor(Math.random() * 10) + 5;
            if (p >= 100) {
                p = 100; clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loading-screen').style.opacity = '0';
                    document.getElementById('loading-screen').style.visibility = 'hidden';
                }, 400);
            }
            document.getElementById('p-bar').style.width = p + '%';
            document.getElementById('p-text').innerText = p + '%';
        }, 80);

        window.onload = () => changeLang('ar');
    </script>
</body>
</html>
