<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">قسم العقيدة - الشيخ محمد زين بن آدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap');

        :root {
            --bg-body: #f7f9fc;
            --bg-surface: #ffffff;
            --primary: #7e22ce; 
            --text-main: #000000;
            --text-dim: #8a8e9e;
            --header-bg: rgba(255, 255, 255, 0.95);
            --border: #e6e9f1;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --tg-blue: #0088cc;
        }

        body.dark-mode {
            --bg-body: #0a0e17; 
            --bg-surface: #101624;
            --primary: #a855f7;
            --text-main: #ffffff;
            --text-dim: #a1a7bc;
            --header-bg: rgba(16, 22, 36, 0.95);
            --border: #232d3f;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #4c1d95;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loading-logo h2 { font-family: 'Amiri', serif; color: #fff; font-size: clamp(1.5rem, 5vw, 2.2rem); text-align: center; }
        .progress-outline { width: 85%; max-width: 500px; height: 50px; border: 2px solid #ffffff; border-radius: 12px; padding: 4px; display: flex; align-items: center; margin-top: 20px; }
        .progress-inner { height: 100%; width: 0%; background: #c084fc; border-radius: 8px; transition: width 0.1s linear; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Kufi Arabic', sans-serif; background: var(--bg-body); color: var(--text-main); overflow-x: hidden; }
        .container { width: 92%; max-width: 1000px; margin: auto; }

        header { position: sticky; top: 0; z-index: 1000; background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 0; }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .back-link { text-decoration: none; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 5px; }
        .lang-btns button { padding: 5px 10px; border: 1px solid var(--border); background: var(--bg-surface); cursor: pointer; border-radius: 8px; font-size: 0.75rem; color: var(--text-main); font-weight: bold; }
        .lang-btns button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .section-header { text-align: center; padding: 30px 0; }
        .section-header h1 { font-family: 'Amiri', serif; font-size: clamp(1.8rem, 6vw, 2.8rem); color: var(--primary); }

        /* تعديل تصميم الكروت لتصبح أزرار انتقال صفحات */
        .book-link-card { 
            background: var(--bg-surface); 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
            box-shadow: var(--shadow); 
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .book-link-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }
        .book-meta h3 { font-size: 1.1rem; color: #1a4269; margin-bottom: 4px; }
        body.dark-mode .book-meta h3 { color: var(--primary); }
        .book-meta p { font-size:0.85rem; color:var(--text-dim); }

        .tg-card { background: var(--bg-surface); padding: 25px 15px; border-radius: 25px; text-align: center; border: 1px solid var(--border); margin: 30px 0; box-shadow: var(--shadow); }
        .tg-icon { background: var(--tg-blue); color: white; width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2rem; }
        .tg-btn { background: var(--tg-blue); color: white; padding: 10px 35px; border-radius: 30px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; }

        footer { padding: 40px 0; margin-top: 50px; background: var(--bg-surface); border-top: 1px solid var(--border); text-align: center; }
        .copyright { font-size: 0.85rem; color: var(--text-main); opacity: 0.8; font-weight: bold; }

        @media (max-width: 480px) {
            .nav-inner { justify-content: center; }
        }
    </style>
</head>
<body class="light-mode">

    <div id="loading-screen">
        <div class="loading-logo">
            <h2>الشيخ محمد زين بن آدم</h2>
            <p style="color: #ddd6fe; text-align: center;">قسم العقيدة</p>
        </div>
        <div class="progress-outline">
            <div class="progress-inner" id="p-bar"></div>
        </div>
        <div class="progress-label" id="p-text" style="color:white; margin-top:10px;">0%</div>
    </div>

    <header>
        <div class="container">
            <div class="nav-inner">
                <a href="/موقع لشيخي/index/index.html" class="back-link">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span data-key="backBtn">الرجوع للرئيسية</span>
                </a>
                <div class="lang-btns">
                    <button class="active" onclick="changeLang('ar')">AR</button>
                    <button onclick="changeLang('en')">EN</button>
                    <button onclick="changeLang('am')">AM</button>
                </div>
                <div onclick="document.body.classList.toggle('dark-mode')" style="cursor:pointer; padding: 5px;"><i class="fa-solid fa-circle-half-stroke"></i></div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="section-header">
            <h1 data-key="pageTitle">قسم العقيدة</h1>
        </div>

        <div id="books-container"></div>

        <div class="tg-card">
            <div class="tg-icon"><i class="fa-brands fa-telegram"></i></div>
            <h3 data-key="tgTitle">قناة الدروس الرسمية</h3>
            <p style="color: var(--text-dim); margin-top:5px; font-size: 0.9rem;" data-key="tgSub">المصدر الرسمي لدروس الشيخ</p>
            <a href="https://t.me/SheikhMuhammedZain" class="tg-btn" data-key="tgJoin">انضمام</a>
        </div>
    </div>

    <footer>
        <div class="container">
            <p class="copyright">&copy; 2026 | <span data-key="rights">جميع الحقوق محفوظة</span></p>
        </div>
    </footer>

    <script>
        const content = {
            ar: {
                backBtn: "الرجوع للرئيسية", pageTitle: "قسم العقيدة", rights: "جميع الحقوق محفوظة",
                tgTitle: "قناة الدروس العلمية", tgSub: "المصدر الرسمي للدروس الصوتية", tgJoin: "انضمام",
                books: [
                    { title: "الدروس المهمة لعامة الأمة", author: "الشيخ ابن باز", url: "droos.html" },
                    { title: "شرح الأصول الثلاثة", author: "الشيخ محمد بن عبد الوهاب", url: "osoul1.html" },
                    { title: "أصول السنة", author: "الإمام أحمد", url: "osoul2.html" },
                    { title: "شرح كشف الشبهات", author: "ابن عبد الوهاب", url: "shubuhat.html" },
                    { title: "شرح مسائل الجاهلية", author: "ابن عبد الوهاب", url: "jahiliya.html" },
                    { title: "شرح العقيدة الطحاوية", author: "الإمام الطحاوي", url: "tahawiya.html" },
                    { title: "ضلال جماعة الأحباش", author: "الشيخ محمد زين", url: "ahbash.html" }
                ]
            },
            en: {
                backBtn: "Home", pageTitle: "Aqida Section", rights: "All Rights Reserved",
                tgTitle: "Official Telegram Channel", tgSub: "Audio source", tgJoin: "Join",
                books: [
                    { title: "Important Lessons", author: "Ibn Baz", url: "droos.html" },
                    { title: "Three Fundamental Principles", author: "Ibn Abdul Wahab", url: "osoul1.html" },
                    { title: "Usul as-Sunnah", author: "Imam Ahmad", url: "osoul2.html" },
                    { title: "Kashf ash-Shubuhat", author: "Ibn Abdul Wahab", url: "shubuhat.html" },
                    { title: "Masail al-Jahiliyah", author: "Ibn Abdul Wahab", url: "jahiliya.html" },
                    { title: "Al-Aqida al-Tahawiyya", author: "Imam al-Tahawi", url: "tahawiya.html" },
                    { title: "Misguidance of Ahbash", author: "Sheikh Mohd Zayn", url: "ahbash.html" }
                ]
            },
            am: {
                backBtn: "ዋና ገጽ", pageTitle: "የአቂዳ ክፍል", rights: "መብቱ በህግ የተጠበቀ ነው",
                tgTitle: "ይፋዊ የቴሌግራም ቻናል", tgSub: "የትምህርቶች ምንጭ", tgJoin: "ይቀላቀሉ",
                books: [
                    { title: "ለህዝብ ጠቃሚ ትምህርቶች", author: "ኢብኑ ባዝ", url: "droos.html" },
                    { title: "ሶስቱ መሠረቶች", author: "ኢብኑ አብዱል ወሃብ", url: "osoul1.html" },
                    { title: "የሱና መሠረቶች", author: "ኢማም አህመድ", url: "osoul2.html" },
                    { title: "ከሽፉ ሹብሃት", author: "ኢብኑ አብዱል ወሃב", url: "shubuhat.html" },
                    { title: "መሳኢል አል-ጃሂሊያ", author: "ኢብኑ አብዱل ወሃብ", url: "jahiliya.html" },
                    { title: "አል-አቂዳ አል-ጣሃዊያ", author: "ኢማም አል-ጣሃዊ", url: "tahawiya.html" },
                    { title: "የአህባሽ ጥምመት", author: "ሸይኽ መሐመድ ዘይን", url: "ahbash.html" }
                ]
            }
        };

        function changeLang(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'en' ? 'ltr' : 'rtl');
            document.querySelectorAll('.lang-btns button').forEach(b => b.classList.remove('active'));
            
            const btns = document.querySelectorAll('.lang-btns button');
            btns.forEach(btn => { if(btn.innerText.toLowerCase() === lang) btn.classList.add('active'); });

            renderBooksMenu(lang);
            document.querySelectorAll('[data-key]').forEach(el => {
                el.innerText = content[lang][el.getAttribute('data-key')];
            });
        }

        function renderBooksMenu(lang) {
            const container = document.getElementById('books-container');
            container.innerHTML = '';
            const list = content[lang].books;

            list.forEach(book => {
                container.innerHTML += `
                    <a href="${book.url}" class="book-link-card">
                        <div class="book-meta">
                            <h3>${book.title}</h3>
                            <p>${book.author}</p>
                        </div>
                        <i class="fa-solid fa-arrow-left" style="transform: ${lang === 'en' ? 'rotate(180deg)' : 'none'}; color: var(--primary);"></i>
                    </a>`;
            });
        }

        // Loader
        let prg = 0;
        const inv = setInterval(() => {
            prg += Math.floor(Math.random() * 12) + 5;
            if (prg >= 100) {
                prg = 100; clearInterval(inv);
                setTimeout(() => { 
                    document.getElementById('loading-screen').style.opacity = '0'; 
                    document.getElementById('loading-screen').style.visibility = 'hidden'; 
                }, 500);
            }
            document.getElementById('p-bar').style.width = prg + '%';
            document.getElementById('p-text').innerText = prg + '%';
        }, 80);

        changeLang('ar');
    </script>
</body>
</html>
