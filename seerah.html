<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة السيرة النبوية - الشيخ محمد زين آدم</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { 
            --gold: #d4af37;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background: #020617;
            color: white; 
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* حاوية المركز للكمبيوتر */
        .container {
            width: 100%;
            max-width: 800px; /* العرض المثالي للكمبيوتر */
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .nebula-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.1), transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(212, 175, 55, 0.08), transparent 40%),
                linear-gradient(135deg, #020617 0%, #064e3b 100%);
            z-index: -1;
        }

        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px); border-bottom: 2px solid var(--gold);
            position: sticky; top: 0; z-index: 1000;
        }

        .back-btn {
            text-decoration: none; color: var(--gold); font-weight: 800;
            font-size: 14px; display: flex; align-items: center; gap: 8px;
            background: rgba(212, 175, 55, 0.1); padding: 8px 15px;
            border-radius: 50px; border: 1px solid var(--gold);
            transition: 0.3s;
        }

        .back-btn:hover { background: var(--gold); color: #000; }

        .section-name { font-size: clamp(14px, 4vw, 18px); font-weight: 900; color: #fff; }

        header.welcome { padding: 40px 20px; text-align: center; }
        header.welcome h1 {
            font-size: clamp(28px, 7vw, 48px); font-weight: 900;
            background: linear-gradient(to bottom, #fff, var(--gold));
            background-clip: text;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .book-card {
            margin: 15px; border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.2);
            background: var(--glass); backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .book-btn {
            padding: 20px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer;
        }

        .book-title { font-size: clamp(18px, 5vw, 24px); font-weight: 900; color: var(--gold); }

        .lessons-list {
            display: none; padding: 15px; background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .lesson-item {
            background: rgba(255, 255, 255, 0.03); margin-bottom: 15px;
            padding: 15px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .lesson-item h4 { font-size: 16px; margin-bottom: 12px; color: #fff; }

        audio { width: 100%; height: 40px; filter: invert(1) hue-rotate(180deg) brightness(1.2); }

        .download-link {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 12px; color: #000; background: var(--gold);
            text-decoration: none; font-weight: 800; font-size: 14px;
            padding: 8px 20px; border-radius: 10px;
        }

        .pdf-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: #dc2626; color: white; text-decoration: none;
            padding: 14px; border-radius: 12px; font-weight: 800; font-size: 16px;
            margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);
        }

        footer { padding: 40px 20px; text-align: center; border-top: 1px solid var(--gold); margin-top: 40px; }

        /* تعديلات الشاشات الكبيرة (الكمبيوتر) */
        @media (min-width: 801px) {
            .book-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        }
    </style>
</head>
<body>

<div class="nebula-bg"></div>

<nav class="top-nav">
    <a href="index.html" class="back-btn"><i class="fas fa-chevron-right"></i> رجوع</a>
    <div class="section-name"><i class="fas fa-history" style="color: var(--gold);"></i> مكتبة السيرة النبوية</div>
</nav>

<div class="container">
    <header class="welcome">
        <h1>السيرة النبوية</h1>
        <p style="color: #94a3b8; font-size: 18px;">شرح الشيخ محمد زين آدم - حفظه الله</p>
    </header>

    <div id="main-content">
        </div>

    <footer>
        <div style="font-size: 20px; font-weight: 900; color: var(--gold);">مكتبة الشيخ محمد زين آدم</div>
        <p style="opacity: 0.6; margin-top: 10px; font-size: 14px;">جميع الحقوق محفوظة 2026</p>
    </footer>
</div>

<script>
    // بيانات الكتب
    const seeraBooks = [
        { 
            title: "الرحيق المختوم", 
            author: "صفي الرحمن المباركفري", 
            count: 108, 
            prefix: "raheeq", 
            pdf: "pdf/raheeq.pdf", 
            unit: "القسم" 
        },
        { 
            title: "دعائم منهاج النبوة", 
            author: "محمد بن سعيد رسلان", 
            count: 118, 
            prefix: "daaim", 
            pdf: "pdf/daaim.pdf", 
            unit: "الغرفة رقم" 
        },
        { 
            title: "خلاصة نور اليقين", 
            author: "عمر عبد الجبار", 
            count: 46, 
            prefix: "noor", 
            pdf: "pdf/noor.pdf", 
            unit: "الدرس" 
        }
    ];

    function toggleBook(element) {
        const content = element.nextElementSibling;
        const icon = element.querySelector('.fa-chevron-down, .fa-chevron-up');
        const isOpen = content.style.display === "block";
        
        // إغلاق أي قائمة مفتوحة أخرى
        document.querySelectorAll('.lessons-list').forEach(el => el.style.display = "none");
        document.querySelectorAll('.book-btn i.fa-chevron-up').forEach(el => el.className = "fas fa-chevron-down");

        if (!isOpen) {
            content.style.display = "block";
            icon.className = "fas fa-chevron-up";
            // تمرير الشاشة للعنوان بسلاسة
            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    // بناء المحتوى
    window.onload = () => {
        let finalHtml = "";
        
        seeraBooks.forEach(book => {
            let lessonsHtml = "";
            for (let i = 1; i <= book.count; i++) {
                let n = i.toString().padStart(3, '0');
                lessonsHtml += `
                    <div class="lesson-item">
                        <h4>${book.unit} ${n}</h4>
                        <audio controls preload="none">
                            <source src="audio/seera/${book.prefix}_${n}.mp3" type="audio/mpeg">
                        </audio>
                        <a href="audio/seera/${book.prefix}_${n}.mp3" download class="download-link">
                            <i class="fas fa-download"></i> تحميل الدرس
                        </a>
                    </div>`;
            }

            finalHtml += `
                <div class="book-card">
                    <div class="book-btn" onclick="toggleBook(this)">
                        <div>
                            <div class="book-title">${book.title}</div>
                            <p style="color: #cbd5e1; font-size: 14px; margin-top:5px;">المؤلف: ${book.author}</p>
                        </div>
                        <i class="fas fa-chevron-down" style="color: var(--gold); font-size: 20px;"></i>
                    </div>
                    <div class="lessons-list">
                        <a href="${book.pdf}" download class="pdf-btn">
                            <i class="fas fa-file-pdf"></i> تحميل الكتاب بصيغة PDF
                        </a>
                        <div style="text-align:center; padding: 15px; border-bottom: 1px dashed var(--gold); margin-bottom: 20px;">
                            <p style="color:var(--gold); font-weight:bold;">عدد الدروس الصوتيّة: ${book.count}</p>
                        </div>
                        ${lessonsHtml}
                    </div>
                </div>`;
        });

        document.getElementById('main-content').innerHTML = finalHtml;
    };
</script>

</body>
</html>
