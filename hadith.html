<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الحديث الشريف - الشيخ محمد زين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap');

        :root {
            --bg-body: #f8f9fa;
            --bg-surface: #ffffff;
            --primary: #c0392b;
            --header-blue: #1a3a5f; /* لون شاشة الترحيب المطابق للتفسير */
            --text-main: #1a1a1a;
            --border: #e6e9f1;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* --- Splash Screen (مثل قسم التفسير) --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--header-blue);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }
        .loading-logo h2 { font-family: 'Amiri', serif; color: #fff; font-size: 2.2rem; text-align: center; margin-bottom: 10px;}
        .loading-logo p { color: #b3e5fc; text-align: center; margin-bottom: 20px; }
        .progress-outline { width: 85%; max-width: 500px; height: 45px; border: 2px solid #ffffff; border-radius: 12px; padding: 4px; display: flex; align-items: center; }
        .progress-inner { height: 100%; width: 0%; background: #3498db; border-radius: 8px; transition: width 0.1s linear; }
        .progress-label { color: white; margin-top: 10px; font-weight: bold; }

        /* --- تنسيقات الصفحة --- */
        body { font-family: 'Noto Kufi Arabic', sans-serif; background: var(--bg-body); margin: 0; transition: 0.3s; }
        header { background: #fff; padding: 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-inner { width: 92%; max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; }
        
        .lang-btns button { padding: 6px 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; border-radius: 8px; font-weight: bold; margin-left: 5px; }
        .lang-btns button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .container { width: 92%; max-width: 1000px; margin: auto; padding-bottom: 50px; }
        .section-title { text-align: center; font-family: 'Amiri', serif; padding: 35px 0; color: var(--primary); font-size: 2.5rem; }

        .book-card { background: #fff; border-radius: 18px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
        .book-top { padding: 22px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .book-info h3 { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--primary); margin: 0 0 5px 0; }
        
        .pdf-btn { display: inline-flex; align-items: center; gap: 8px; background: #e74c3c; color: #fff; padding: 8px 18px; border-radius: 10px; text-decoration: none; font-size: 0.85rem; margin: 0 22px 20px; font-weight: bold; transition: 0.2s; }
        .pdf-btn:hover { background: #c0392b; }

        .lessons-list { display: none; padding: 15px; background: #fcfcfc; border-top: 1px solid var(--border); max-height: 450px; overflow-y: auto; }
        .book-card.active .lessons-list { display: block; }
        
        .audio-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; gap: 10px; }
        .audio-row span { font-size: 0.9rem; font-weight: bold; min-width: 90px; }
        audio { height: 35px; flex-grow: 1; }

        footer { text-align: center; padding: 30px; opacity: 0.7; font-size: 0.85rem; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-logo">
            <h2>الشيخ محمد زين بن آدم</h2>
            <p id="splash-text">قسم الحديث النبوي الشريف</p>
        </div>
        <div class="progress-outline"><div class="progress-inner" id="p-bar"></div></div>
        <div class="progress-label" id="p-text">0%</div>
    </div>

    <header>
        <div class="nav-inner">
            <a href="index.html" style="text-decoration: none; color: var(--primary); font-weight: bold;"><i class="fa-solid fa-house"></i> <span data-key="back">الرئيسية</span></a>
            <div class="lang-btns">
                <button id="btn-ar" class="active" onclick="changeLang('ar')">AR</button>
                <button id="btn-en" onclick="changeLang('en')">EN</button>
                <button id="btn-am" onclick="changeLang('am')">AM</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="section-title" data-key="title">شروح كتب الحديث</h1>
        <div id="books-list"></div>
    </div>

    <footer>&copy; 2026 | <span data-key="footer">جميع الحقوق محفوظة - الشيخ محمد زين بن آدم</span></footer>

    <script>
        const translations = {
            ar: {
                back: "الرئيسية", title: "قسم الحديث الشريف", footer: "جميع الحقوق محفوظة - الشيخ محمد زين", lesson: "الدرس", pdf: "تحميل الكتاب PDF",
                books: [
                    { title: "سنن أبي داود", author: "الإمام أبو داود السجستاني", total: 332, slug: "abudawood" },
                    { title: "بلوغ المرام", author: "الحافظ ابن حجر العسقلاني", total: 292, slug: "bulugh" },
                    { title: "صحيح مسلم", author: "الإمام مسلم بن الحجاج", total: 225, slug: "muslim" },
                    { title: "جامع الترمذي", author: "الإمام الترمذي", total: 97, slug: "tirmidhi" },
                    { title: "صحيح البخاري", author: "الإمام البخاري", total: 74, slug: "bukhari" },
                    { title: "مصطلح الحديث", author: "الشيخ ابن عثيمين", total: 17, slug: "mustalah" },
                    { title: "الأربعون النووية", author: "الإمام النووي", total: 5, slug: "nawawi" }
                ]
            },
            en: {
                back: "Home", title: "Hadith Department", footer: "All Rights Reserved - Sheikh Mohammed Zayn", lesson: "Lesson", pdf: "Download PDF",
                books: [
                    { title: "Sunan Abi Dawood", author: "Imam Abu Dawood", total: 332, slug: "abudawood" },
                    { title: "Bulugh al-Maram", author: "Ibn Hajar al-Asqalani", total: 292, slug: "bulugh" },
                    { title: "Sahih Muslim", author: "Imam Muslim", total: 225, slug: "muslim" },
                    { title: "Jami' al-Tirmidhi", author: "Imam al-Tirmidhi", total: 97, slug: "tirmidhi" },
                    { title: "Sahih al-Bukhari", author: "Imam al-Bukhari", total: 74, slug: "bukhari" },
                    { title: "Hadith Terminology", author: "Sheikh Ibn Uthaymeen", total: 17, slug: "mustalah" },
                    { title: "The Forty Hadith", author: "Imam al-Nawawi", total: 5, slug: "nawawi" }
                ]
            },
            am: {
                back: "ዋና ገጽ", title: "የሀዲስ ትምህርቶች", footer: "መብቱ የተጠበቀ ነው - ሸይኽ መሐመድ ዘይን", lesson: "ክፍል", pdf: "መጽሐፉን አውርድ (PDF)",
                books: [
                    { title: "ሱነን አቢ ዳውድ", author: "ኢማም አቡ ዳውድ", total: 332, slug: "abudawood" },
                    { title: "ቡሉጉል መራም", author: "ኢብኑ ሀጀር", total: 292, slug: "bulugh" },
                    { title: "ሶሒህ ሙስሊም", author: "ኢማም ሙስሊም", total: 225, slug: "muslim" },
                    { title: "ጃሚዕ አት-ቲርሚዚ", author: "ኢማም አት-ቲርሚዚ", total: 97, slug: "tirmidhi" },
                    { title: "ሶሒህ አል-ቡኻሪ", author: "ኢማም አል-ቡኻሪ", total: 74, slug: "bukhari" },
                    { title: "ሙስጣለሃል ሀዲስ", author: "ሸይኽ ኢብኑ ኡሰይሚን", total: 17, slug: "mustalah" },
                    { title: "አርበዑን አል-ነወዊያ", author: "ኢማም አል-ነወዊ", total: 5, slug: "nawawi" }
                ]
            }
        };

        function changeLang(lang) {
            // تحديث حالة الأزرار
            document.querySelectorAll('.lang-btns button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');

            // تحديث النصوص
            document.querySelectorAll('[data-key]').forEach(el => {
                el.innerText = translations[lang][el.getAttribute('data-key')];
            });

            renderBooks(lang);
        }

        function renderBooks(lang) {
            const list = document.getElementById('books-list');
            list.innerHTML = '';
            translations[lang].books.forEach(book => {
                let audioRows = '';
                for(let i=1; i<=book.total; i++) {
                    const url = `https://archive.org/download/osoul-5/${book.slug}%20(${i}).mp3`;
                    audioRows += `
                        <div class="audio-row">
                            <span>${translations[lang].lesson} ${i}</span>
                            <audio controls preload="none"><source src="${url}"></audio>
                        </div>`;
                }
                list.innerHTML += `
                    <div class="book-card">
                        <div class="book-top" onclick="this.parentElement.classList.toggle('active')">
                            <div class="book-info"><h3>${book.title}</h3><small>${book.author}</small></div>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                        <a href="#" class="pdf-btn"><i class="fa-solid fa-file-pdf"></i> ${translations[lang].pdf}</a>
                        <div class="lessons-list">${audioRows}</div>
                    </div>`;
            });
        }

        // Loader Logic
        let p = 0;
        const interval = setInterval(() => {
            p += Math.floor(Math.random() * 10) + 5;
            if (p >= 100) {
                p = 100; clearInterval(interval);
                setTimeout(() => {
                    document.getElementById('loading-screen').style.opacity = '0';
                    document.getElementById('loading-screen').style.visibility = 'hidden';
                }, 400);
            }
            document.getElementById('p-bar').style.width = p + '%';
            document.getElementById('p-text').innerText = p + '%';
        }, 100);

        window.onload = () => changeLang('ar');
    </script>
</body>
</html>
