<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">قريباً إن شاء الله | موقع الشيخ محمد زين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap');

        :root {
            --primary: #0d9488;
            --primary-hover: #096a62;
            --bg: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #101624;
            --text-dim: #6b7280;
            --border: #e6e9f1;
            --tg-blue: #0088cc;
            --tg-blue-hover: #0077b3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Noto Kufi Arabic', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            padding: 20px;
        }

        /* أزرار تغيير اللغة */
        .lang-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .lang-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 25px 30px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(13, 148, 136, 0.1);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 20px;
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        p.desc {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            background: var(--primary-hover);
        }

        /* فاصل رفيع */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 10px 0 25px;
        }

        /* كارت التليجرام */
        .tg-section {
            background: rgba(0, 136, 204, 0.04);
            border: 1px solid rgba(0, 136, 204, 0.15);
            border-radius: 18px;
            padding: 20px 15px;
        }

        .tg-icon {
            color: var(--tg-blue);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .tg-section h3 {
            font-size: 1.05rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .tg-section p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .tg-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--tg-blue);
            color: white;
            padding: 9px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.3s ease;
        }

        .tg-btn:hover {
            background: var(--tg-blue-hover);
        }
    </style>
</head>
<body>

    <!-- أزرار اختيار اللغة -->
    <div class="lang-container">
        <button id="btn-ar" class="lang-btn active" onclick="changeLang('ar')">عربي</button>
        <button id="btn-en" class="lang-btn" onclick="changeLang('en')">English</button>
        <button id="btn-am" class="lang-btn" onclick="changeLang('am')">አማርኛ</button>
    </div>

    <div class="card">
        <div class="icon-box">
            <i class="fa-solid fa-hourglass-half"></i>
        </div>
        
        <h1 id="title-text">قريباً إن شاء الله</h1>
        <p class="desc" id="desc-text">هذا الدرس قيد المراجعة والتجهيز وسيتم رفعه وإتاحته في الموقع قريباً بإذن الله تعالى.</p>
        
        <a href="javascript:history.back()" class="back-btn" id="back-btn-text">
            <i class="fa-solid fa-arrow-right" id="arrow-icon"></i>
            <span>الرجوع للدروس</span>
        </a>

        <div class="divider"></div>

        <!-- كارت التليجرام في الأسفل -->
        <div class="tg-section">
            <div class="tg-icon"><i class="fa-brands fa-telegram"></i></div>
            <h3 id="tg-title">تابع الجديد عبر قناة التليجرام</h3>
            <p id="tg-sub">يمكنك متابعة قناة الدروس الرسمية للشيخ ليصلك كل جديد فور نزوله</p>
            <a href="https://t.me/SheikhMuhammedZainAdam" class="tg-btn" target="_blank" id="tg-btn-text">
                <i class="fa-brands fa-telegram"></i>
                <span>الانضمام للقناة</span>
            </a>
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                pageTitle: "قريباً إن شاء الله | موقع الشيخ محمد زين",
                title: "قريباً إن شاء الله",
                desc: "هذا الدرس قيد المراجعة والتجهيز وسيتم رفعه وإتاحته في الموقع قريباً بإذن الله تعالى.",
                backBtn: "الرجوع للدروس",
                tgTitle: "تابع الجديد عبر قناة التليجرام",
                tgSub: "يمكنك متابعة قناة الدروس الرسمية للشيخ ليصلك كل جديد فور نزوله",
                tgBtn: "الانضمام للقناة"
            },
            en: {
                pageTitle: "Coming Soon | Sheikh Mohammed Zayn",
                title: "Coming Soon, Insha'Allah",
                desc: "This lesson is currently under review and preparation, and will be uploaded soon, God willing.",
                backBtn: "Back to Lessons",
                tgTitle: "Follow Updates on Telegram",
                tgSub: "Follow the official channel to get notified as soon as new lessons are published",
                tgBtn: "Join Channel"
            },
            am: {
                pageTitle: "በቅርቡ ኢንሻ አላህ | የሸይኽ መሐመድ ዘይን ድረ-ገጽ",
                title: "በቅርቡ ኢንሻ አላህ",
                desc: "ይህ ትምህርት በዝግጅት ላይ ነው፤ በቅርቡ በድረ-ገጹ ላይ ይለቀቃል ኢንሻ አላህ።",
                backBtn: "ወደ ትምህርቶች ተመለስ",
                tgTitle: "አዳዲስ ትምህርቶችን በቴሌግራም ይከታተሉ",
                tgSub: "አዳዲስ ትምህርቶች ሲለቀቁ ወዲያውኑ ለማግኘት ይፋዊውን የቴሌግራም ቻናል ይቀላቀሉ",
                tgBtn: "ቻናሉን ይቀላቀሉ"
            }
        };

        function changeLang(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

            // التصوص المتغيرة
            document.getElementById('page-title').innerText = translations[lang].pageTitle;
            document.getElementById('title-text').innerText = translations[lang].title;
            document.getElementById('desc-text').innerText = translations[lang].desc;
            document.querySelector('#back-btn-text span').innerText = translations[lang].backBtn;
            document.getElementById('tg-title').innerText = translations[lang].tgTitle;
            document.getElementById('tg-sub').innerText = translations[lang].tgSub;
            document.querySelector('#tg-btn-text span').innerText = translations[lang].tgBtn;

            // تغيير اتجاه سهم العودة بحسب اتجاه اللغة
            const arrowIcon = document.getElementById('arrow-icon');
            if (lang === 'ar') {
                arrowIcon.className = 'fa-solid fa-arrow-right';
            } else {
                arrowIcon.className = 'fa-solid fa-arrow-left';
            }

            // تحديث الأزرار المحددة
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
        }
    </script>
</body>
</html>
