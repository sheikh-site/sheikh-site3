<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">شرح مقدمة التفسير - الشيخ محمد زين بن آدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap');

        :root {
            --bg-body: #f7f9fc;
            --bg-surface: #ffffff;
            --primary: #0d9488;
            --text-main: #000000;
            --text-dim: #8a8e9e;
            --header-bg: rgba(255, 255, 255, 0.95);
            --border: #e6e9f1;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --tg-blue: #0088cc;
            --pdf-red: #ef4444;
        }

        body.dark-mode {
            --bg-body: #0a0e17; 
            --bg-surface: #101624;
            --primary: #14b8a6;
            --text-main: #ffffff;
            --text-dim: #a1a7bc;
            --header-bg: rgba(16, 22, 36, 0.95);
            --border: #232d3f;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #004d40;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loading-logo h2 { font-family: 'Amiri', serif; color: #fff; font-size: clamp(1.5rem, 5vw, 2.2rem); text-align: center; }
        .progress-outline { width: 85%; max-width: 500px; height: 50px; border: 2px solid #ffffff; border-radius: 12px; padding: 4px; display: flex; align-items: center; margin-top: 20px; }
        .progress-inner { height: 100%; width: 0%; background: #81d4fa; border-radius: 8px; transition: width 0.1s linear; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Kufi Arabic', sans-serif; background: var(--bg-body); color: var(--text-main); overflow-x: hidden; }
        .container { width: 92%; max-width: 1000px; margin: auto; }

        header { position: sticky; top: 0; z-index: 1000; background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 0; }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .back-link { text-decoration: none; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 5px; }
        .lang-btns button { padding: 5px 10px; border: 1px solid var(--border); background: var(--bg-surface); cursor: pointer; border-radius: 8px; font-size: 0.75rem; color: var(--text-main); font-weight: bold; }
        .lang-btns button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .section-header { text-align: center; padding: 30px 0; }
        .section-header h1 { font-family: 'Amiri', serif; font-size: clamp(1.8rem, 6vw, 2.8rem); color: var(--primary); }
        .section-header p { color: var(--text-dim); font-size: 1rem; margin-top: 5px; margin-bottom: 15px; }

        /* ستايل زر الـ PDF الجديد */
        .pdf-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-surface);
            color: var(--pdf-red);
            border: 2px solid var(--pdf-red);
            padding: 10px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }
        .pdf-btn:hover {
            background: var(--pdf-red);
            color: white;
            transform: translateY(-2px);
        }

        .book-wrapper { background: var(--bg-surface); border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: var(--shadow); overflow: hidden; margin-top: 20px; }
        
        .lessons-pane { padding: 10px 20px 20px; }

        .audio-row { 
            display: flex; align-items: center; justify-content: space-between; padding: 15px 0; 
            border-bottom: 1px solid var(--border); gap: 15px;
        }
        .audio-row:last-child { border-bottom: none; }
        .audio-row span { font-size: 0.9rem; font-weight: 600; color: var(--text-main); min-width: 80px; }
        audio { height: 35px; flex-grow: 1; border-radius: 30px; }

        .tg-card { background: var(--bg-surface); padding: 25px 15px; border-radius: 25px; text-align: center; border: 1px solid var(--border); margin: 30px 0; box-shadow: var(--shadow); }
        .tg-icon { background: var(--tg-blue); color: white; width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2rem; }
        .tg-btn { background: var(--tg-blue); color: white; padding: 10px 35px; border-radius: 30px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; }

        footer { padding: 40px 0; margin-top: 50px; background: var(--bg-surface); border-top: 1px solid var(--border); text-align: center; }
        .footer-content { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #footer-info { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; max-width: 700px; margin: 0 auto; padding: 0 15px; }
        .copyright { font-size: 0.85rem; color: var(--text-main); opacity: 0.8; font-weight: bold; }

        @media (max-width: 480px) {
            .audio-row { flex-direction: column; align-items: stretch; gap: 12px; padding: 15px 10px; }
            audio { width: 100% !important; }
        }
    </style>
</head>
<body class="light-mode">

    <div id="loading-screen">
        <div class="loading-logo">
            <h2>الشيخ محمد زين بن آدم</h2>
            <p style="color: #b2dfdb; text-align: center;" data-key="loadingSub">شرح مقدمة في التفسير</p>
        </div>
        <div class="progress-outline">
            <div class="progress-inner" id="p-bar"></div>
        </div>
        <div class="progress-label" id="p-text" style="color:white; margin-top:10px;">0%</div>
    </div>

    <header>
        <div class="container">
            <div class="nav-inner">
                <a href="tafseer.html" class="back-link">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span data-key="backBtn">الرجوع لقائمة التفسير</span>
                </a>
                <div class="lang-btns">
                    <button id="btn-ar" class="active" onclick="changeLang('ar')">AR</button>
                    <button id="btn-en" onclick="changeLang('en')">EN</button>
                    <button id="btn-am" onclick="changeLang('am')">AM</button>
                </div>
                <div onclick="document.body.classList.toggle('dark-mode')" style="cursor:pointer; padding: 5px;"><i class="fa-solid fa-circle-half-stroke"></i></div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="section-header">
            <h1 id="book-main-title">شرح مقدمة في التفسير</h1>
            <p id="book-author-sub">تأليف شيخ الإسلام ابن تيمية - شروحات فضيلة الشيخ محمد زين</p>
            
            <a href="#" id="pdf-link" class="pdf-btn" target="_blank">
                <i class="fa-solid fa-file-pdf"></i>
                <span id="pdf-btn-text">تحميل الكتاب PDF</span>
            </a>
        </div>

        <div class="book-wrapper">
            <div class="lessons-pane" id="lessons-container"></div>
        </div>

        <div class="tg-card">
            <div class="tg-icon"><i class="fa-brands fa-telegram"></i></div>
            <h3 data-key="tgTitle">قناة الدروس الرسمية</h3>
            <p style="color: var(--text-dim); margin-top:5px; font-size: 0.9rem;" data-key="tgSub">المصدر الرسمي لدروس الشيخ</p>
            <a href="https://t.me/SheikhMuhammedZain/2849" class="tg-btn" data-key="tgJoin">انضمام</a>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p id="footer-info"></p>
                <p class="copyright">
                    &copy; 2026 | <span data-key="rights">جميع الحقوق محفوظة لموقع الشيخ محمد زين</span>
                </p>
            </div>
        </div>
    </footer>

    <script>
        const pageContent = {
            ar: {
                backBtn: "الرجوع لقائمة التفسير", 
                bookTitle: "شرح مقدمة في التفسير",
                authorSub: "تأليف شيخ الإسلام ابن تيمية - شروحات فضيلة الشيخ محمد زين",
                rights: "جميع الحقوق محفوظة لموقع الشيخ محمد زين", 
                lesson: "الدرس",
                loadingSub: "شرح مقدمة في التفسير",
                pdfText: "تحميل المتن PDF",
                tgTitle: "قناة الدروس العلمية", 
                tgSub: "المصدر الرسمي للدروس الصوتية", 
                tgJoin: "انضمام",
                footerDesc: "شروحات كتاب مقدمة التفسير لفضيلة الشيخ محمد زين بن آدم بصيغ مسموعة ومباشرة.",
                bookData: { total: 44, folder: "muqedima-32", pdfFile: "muqedima.pdf" } // ضع هنا اسم ملف الـ PDF المرفوع في الأرشيف
            },
            en: {
                backBtn: "Back to Tafsir Menu", 
                bookTitle: "Explanation of Tafsir Introduction",
                authorSub: "By Ibn Taymiyyah - Lectures by Sheikh Mohammed Zayn",
                rights: "All Rights Reserved to Sheikh Mohammed Zayn Website", 
                lesson: "Lesson",
                loadingSub: "Tafsir Introduction",
                pdfText: "Download Book PDF",
                tgTitle: "Official Channel", 
                tgSub: "Source for audio lessons", 
                tgJoin: "Join",
                footerDesc: "Audio lectures explaining the Introduction of Tafsir by Sheikh Mohammed Zayn.",
                bookData: { total: 44, folder: "muqedima-32", pdfFile: "muqedima.pdf" }
            },
            am: {
                backBtn: "ወደ ተፍሲር ማውጫ ተመለስ", 
                bookTitle: "የተፍሲር መግቢያ ማብራሪያ",
                authorSub: "በኢብኑ ተይሚያ - በሸይኽ መሐመድ ዘይን የተሰጠ ትምህርት",
                rights: "መብቱ በህግ የተጠበቀ ነው የሸይኽ መሐመድ ዘይን ድረ-ገጽ", 
                lesson: "ትምህርት",
                loadingSub: "የተፍሲር መግቢያ",
                pdfText: "መጽሐፉን PDF ያውርዱ",
                tgTitle: "ይፋዊ ቻናል", 
                tgSub: "የድምጽ ትምህርቶች ምንጭ", 
                tgJoin: "ይቀላቀሉ",
                footerDesc: "በሸይኽ መሐመድ ዘይን የተሰጡ የተፍሲር መግቢያ ትምህርቶች በድምጽ።",
                bookData: { total: 44, folder: "muqedima-32", pdfFile: "muqedima.pdf" }
            }
        };

        function renderLessons(lang) {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';
            const book = pageContent[lang].bookData;
            
            // تحديث رابط زر الـ PDF تلقائياً بناءً على المجلد والملف المكتوب في الـ bookData فوق
            const pdfUrl = `/موقع لشيخي/tafseer/${book.pdfFile}`;
            document.getElementById('pdf-link').href = pdfUrl;
            document.getElementById('pdf-btn-text').innerText = pageContent[lang].pdfText;

            let html = '';
            for(let i=1; i<=book.total; i++) {
                const fileName = `muqedima (${i}).mp3`;
                const url = `https://archive.org/download/${book.folder}/${encodeURIComponent(fileName)}`;
                
                html += `
                    <div class="audio-row">
                        <span>${pageContent[lang].lesson} ${i}</span>
                        <audio controls preload="none">
                            <source src="${url}" type="audio/mpeg">
                        </audio>
                    </div>`;
            }
            container.innerHTML = html;
        }

        function changeLang(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar' || lang === 'am') ? 'rtl' : 'ltr';
            
            document.getElementById('book-main-title').innerText = pageContent[lang].bookTitle;
            document.getElementById('book-author-sub').innerText = pageContent[lang].authorSub;
            document.getElementById('footer-info').innerText = pageContent[lang].footerDesc;

            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if(pageContent[lang][key]) el.innerText = pageContent[lang][key];
            });

            document.querySelectorAll('.lang-btns button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');

            renderLessons(lang);
        }

        let prg = 0;
        const inv = setInterval(() => {
            prg += 5;
            if (prg >= 100) {
                clearInterval(inv);
                setTimeout(() => { 
                    document.getElementById('loading-screen').style.opacity = '0'; 
                    document.getElementById('loading-screen').style.visibility = 'hidden'; 
                }, 300);
            }
            document.getElementById('p-bar').style.width = prg + '%';
            document.getElementById('p-text').innerText = prg + '%';
        }, 20);

        changeLang('ar');
    </script>
</body>
</html>
