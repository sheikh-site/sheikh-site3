<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">قسم التفسير - الشيخ محمد زين بن آدم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@100..900&display=swap');

        :root {
            --bg-body: #f7f9fc;
            --bg-surface: #ffffff;
            --primary: #0d9488;
            --text-main: #000000;
            --text-dim: #8a8e9e;
            --header-bg: rgba(255, 255, 255, 0.95);
            --border: #e6e9f1;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --tg-blue: #0088cc;
        }

        body.dark-mode {
            --bg-body: #0a0e17; 
            --bg-surface: #101624;
            --primary: #14b8a6;
            --text-main: #ffffff;
            --text-dim: #a1a7bc;
            --header-bg: rgba(16, 22, 36, 0.95);
            --border: #232d3f;
        }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #004d40;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loading-logo h2 { font-family: 'Amiri', serif; color: #fff; font-size: clamp(1.5rem, 5vw, 2.2rem); text-align: center; }
        .progress-outline { width: 85%; max-width: 500px; height: 50px; border: 2px solid #ffffff; border-radius: 12px; padding: 4px; display: flex; align-items: center; margin-top: 20px; }
        .progress-inner { height: 100%; width: 0%; background: #81d4fa; border-radius: 8px; transition: width 0.1s linear; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Kufi Arabic', sans-serif; background: var(--bg-body); color: var(--text-main); overflow-x: hidden; }
        .container { width: 92%; max-width: 1000px; margin: auto; }

        header { position: sticky; top: 0; z-index: 1000; background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 0; }
        .nav-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .back-link { text-decoration: none; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 5px; }
        .lang-btns button { padding: 5px 10px; border: 1px solid var(--border); background: var(--bg-surface); cursor: pointer; border-radius: 8px; font-size: 0.75rem; color: var(--text-main); font-weight: bold; }
        .lang-btns button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .section-header { text-align: center; padding: 30px 0; }
        .section-header h1 { font-family: 'Amiri', serif; font-size: clamp(1.8rem, 6vw, 2.8rem); color: var(--primary); }

        /* ستايل كروت الكتب الجديد والمميز */
        .grid-books { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .book-card { 
            background: var(--bg-surface); 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            padding: 25px; 
            box-shadow: var(--shadow); 
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .book-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--primary); 
        }
        .book-info h3 { font-size: 1.25rem; color: #1a4269; margin-bottom: 8px; font-family: 'Noto Kufi Arabic', sans-serif; }
        body.dark-mode .book-card h3 { color: var(--primary); }
        .book-info p { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 15px; }
        
        .book-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--border); 
            padding-top: 15px; 
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: bold;
        }
        .book-footer span { color: var(--text-dim); font-weight: normal; }

        .tg-card { background: var(--bg-surface); padding: 25px 15px; border-radius: 25px; text-align: center; border: 1px solid var(--border); margin: 30px 0; box-shadow: var(--shadow); }
        .tg-icon { background: var(--tg-blue); color: white; width: 60px; height: 60px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 2rem; }
        .tg-btn { background: var(--tg-blue); color: white; padding: 10px 35px; border-radius: 30px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 15px; }

        footer { padding: 40px 0; margin-top: 50px; background: var(--bg-surface); border-top: 1px solid var(--border); text-align: center; }
        .footer-content { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #footer-info { color: var(--text-dim); font-size: 0.9rem; line-height: 1.6; max-width: 700px; margin: 0 auto; padding: 0 15px; }
        .copyright { font-size: 0.85rem; color: var(--text-main); opacity: 0.8; font-weight: bold; }
    </style>
</head>
<body class="light-mode">

    <div id="loading-screen">
        <div class="loading-logo">
            <h2>الشيخ محمد زين بن آدم</h2>
            <p style="color: #b2dfdb; text-align: center;" data-key="pageTitle">قسم التفسير</p>
        </div>
        <div class="progress-outline">
            <div class="progress-inner" id="p-bar"></div>
        </div>
        <div class="progress-label" id="p-text" style="color:white; margin-top:10px;">0%</div>
    </div>

    <header>
        <div class="container">
            <div class="nav-inner">
                <a href="/موقع لشيخي/index/index.html" class="back-link">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span data-key="backBtn">الرجوع للرئيسية</span>
                </a>
                <div class="lang-btns">
                    <button id="btn-ar" class="active" onclick="changeLang('ar')">AR</button>
                    <button id="btn-en" onclick="changeLang('en')">EN</button>
                    <button id="btn-am" onclick="changeLang('am')">AM</button>
                </div>
                <div onclick="document.body.classList.toggle('dark-mode')" style="cursor:pointer; padding: 5px;"><i class="fa-solid fa-circle-half-stroke"></i></div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="section-header">
            <h1 data-key="pageTitle">قسم التفسير</h1>
        </div>

        <div class="grid-books" id="books-grid"></div>

        <div class="tg-card">
            <div class="tg-icon"><i class="fa-brands fa-telegram"></i></div>
            <h3 data-key="tgTitle">قناة الدروس الرسمية</h3>
            <p style="color: var(--text-dim); margin-top:5px; font-size: 0.9rem;" data-key="tgSub">المصدر الرسمي لدروس الشيخ</p>
            <a href="https://t.me/SheikhMuhammedZainAdam" class="tg-btn" data-key="tgJoin">انضمام</a>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-content">
                <p id="footer-info"></p>
                <p class="copyright">
                    &copy; 2026 | <span data-key="rights">جميع الحقوق محفوظة</span>
                </p>
            </div>
        </div>
    </footer>

    <script>
        const content = {
            ar: {
                backBtn: "الرجوع للرئيسية", pageTitle: "قسم التفسير", rights: "جميع الحقوق محفوظة", 
                tgTitle: "قناة الدروس العلمية", tgSub: "المصدر الرسمي للدروس الصوتية", tgJoin: "انضمام",
                footerDesc: "شروحات كتب التفسير لفضيلة الشيخ محمد زين بن آدم بصيغ مسموعة.",
                viewBook: "عرض الدروس ←", lessonsCount: "درساً",
                books: [
                    { title: "أصول في التفسير", author: "الشيخ ابن عثيمين", total: 11, file: "osoul.html" },
                    { title: "القواعد الحسان في تفسير القرآن", author: "الشيخ العلامة السعدي", total: 53, file: "qawaid.html" },
                    { title: "شرح مقدمة التفسير", author: "شيخ الإسلام ابن تيمية", total: 44, file: "muqedima.html" }
                ]
            },
            en: {
                backBtn: "Home", pageTitle: "Tafsir Section", rights: "All Rights Reserved", 
                tgTitle: "Official Channel", tgSub: "Source for audio lessons", tgJoin: "Join",
                footerDesc: "Tafsir explanations by Sheikh Mohammed Zayn.",
                viewBook: "View Lessons ←", lessonsCount: "Lessons",
                books: [
                    { title: "Principles of Tafsir", author: "Ibn Uthaymeen", total: 11, file: "osoul.html" },
                    { title: "Al-Qawa'id al-Hisan", author: "Al-Sa'di", total: 53, file: "qawaid.html" },
                    { title: "Tafsir Introduction", author: "Ibn Taymiyyah", total: 44, file: "muqedima.html" }
                ]
            },
            am: {
                backBtn: "ዋና ገጽ", pageTitle: "የተፍሲር ክፍል", rights: "መብቱ በህግ የተጠበቀ ነው", 
                tgTitle: "ይፋዊ ቻናል", tgSub: "የድምጽ ትምህርቶች", tgJoin: "ይቀላቀሉ",
                footerDesc: "በሸይኽ መሐመድ ዘይን የተሰጡ የተፍሲር ትምህርቶች በድምጽ።",
                viewBook: "ትምህርቶችን ይመልከቱ ←", lessonsCount: "ትምህርቶች",
                books: [
                    { title: "የተፍሲር መሠረቶች", author: "ኢብኑ ዑሰይሚን", total: 11, file: "osoul.html" },
                    { title: "አል-ቀዋኢድ አል-ሂሳን", author: "አል-ሰዕዲ", total: 53, file: "qawaid.html" },
                    { title: "የተፍሲር መግቢያ", author: "ኢብኑ ተይሚያ", total: 44, file: "muqedima.html" }
                ]
            }
        };

        function renderGrid(lang) {
            const grid = document.getElementById('books-grid');
            grid.innerHTML = '';
            
            content[lang].books.forEach(book => {
                grid.innerHTML += `
                    <a href="${book.file}" class="book-card">
                        <div class="book-info">
                            <h3>${book.title}</h3>
                            <p>${book.author}</p>
                        </div>
                        <div class="book-footer">
                            <span>${book.total} ${content[lang].lessonsCount}</span>
                            <div>${content[lang].viewBook}</div>
                        </div>
                    </a>`;
            });
        }

        function changeLang(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar' || lang === 'am') ? 'rtl' : 'ltr';
            
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if(content[lang][key]) el.innerText = content[lang][key];
            });

            document.getElementById('footer-info').innerText = content[lang].footerDesc;
            document.querySelectorAll('.lang-btns button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');

            renderGrid(lang);
        }

        let prg = 0;
        const inv = setInterval(() => {
            prg += 5;
            if (prg >= 100) {
                clearInterval(inv);
                setTimeout(() => { 
                    document.getElementById('loading-screen').style.opacity = '0'; 
                    document.getElementById('loading-screen').style.visibility = 'hidden'; 
                }, 300);
            }
            document.getElementById('p-bar').style.width = prg + '%';
            document.getElementById('p-text').innerText = prg + '%';
        }, 20);

        changeLang('ar');
    </script>
</body>
</html>
